<!DOCTYPE html>
<html>
<head>
    <title>Contacter le professeur</title>
    <meta charset="UTF-8">
</head>
<body>

<h2>Envoyer un message au professeur</h2>

<form action="message_envoye.html" method="get">
    <label>Nom complet :</label><br>
    <input type="text" name="nom" required><br><br>

    <label>Votre email :</label><br>
    <input type="email" name="email" required><br><br>

    <label>Message :</label><br>
    <textarea name="message" rows="5" cols="30" required></textarea><br><br>

    <input type="submit" value="Envoyer le message">
</form>

<br>
<a href="emploi_du_temps.html">← Retour à l'emploi du temps</a>

</body>
</html>
